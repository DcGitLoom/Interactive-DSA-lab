[project]
name = "dsalab"
version = "0.1.0"
description = "Interactive DSA Lab: data structures and algorithms built from scratch, traced, visualised, tested and benchmarked."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dhruv Chaudhari" }]
dependencies = []

[project.optional-dependencies]
# The library itself has zero dependencies on purpose. These extras are only
# for the parts that draw pictures or run the test suite.
app = ["streamlit>=1.37", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dsalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
